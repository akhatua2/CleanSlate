eval:
  window_prefix_len: 100
  window_suffix_len: 100
  window_stride: 10
  tau_min: 0.001
  batch_size: 2048

vllm:
  num_gpus: 1            # TP per DP rank
  data_parallel: 2       # 2 replicas
  gpu_ids: [2, 4]        # physical GPU indices, len == data_parallel * num_gpus
  gpu_memory_utilization: 0.92
  max_model_len: 512
  dtype: bfloat16
  enforce_eager: false
