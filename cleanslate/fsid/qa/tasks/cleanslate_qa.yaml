task: cleanslate_qa
dataset_path: unlearning-cleanslate/cleanslate_dataset
dataset_name: qa_benchmark
test_split: train
output_type: generate_until
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{answer}}"
generation_kwargs:
  until:
    - "\n"
    - "Question:"
  max_gen_toks: 64
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.llm_judge_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
