model_name: null        # e.g. allenai/OLMo-3-32B
forget_path: null       # data/fsid/curated/<rule>/forget_set.parquet
objective: ga
retain_path: null       # GA does not need a retain set
forget_weight: 1.0
retain_weight: 0.0      # 0 = pure gradient ascent on forget set only
retain_loss_type: nll
num_epochs: 5
batch_size: 8
gradient_accum_steps: 4
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 20
max_grad_norm: 1.0
output_dir: runs
save_every: 100
log_every: 10
dtype: bfloat16
fsdp_sharding_strategy: full_shard
seed: 42
num_workers: 0
gradient_checkpointing: false
torch_compile: false
