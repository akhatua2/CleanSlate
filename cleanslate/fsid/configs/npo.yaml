model_name: null
forget_path: null
objective: npo
npo_beta: 0.1            # β: drift budget of π_θ vs π_ref
retain_path: null        # required: NPO without retain term degrades globally
forget_weight: 1.0
retain_weight: 1.0       # open-unlearning alpha=1.0
retain_loss_type: nll
num_epochs: 2
batch_size: 2
gradient_accum_steps: 16
lr: 1.0e-5
weight_decay: 0.0
warmup_steps: 20
max_grad_norm: 1.0
output_dir: runs
save_every: 0
log_every: 10
validation_path: null
eval_every: 50
eval_max_samples: 200
device: auto
dtype: bfloat16
distributed_strategy: single
fsdp_sharding_strategy: full_shard
fsdp_cpu_offload: false
seed: 42
num_workers: 0
gradient_checkpointing: false
torch_compile: false
