[project]
name = "cleanslate"
version = "0.1.0"
description = "Calculate probability of model outputs given seed tokens"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "pyarrow>=23.0.0",
    "fastparquet>=2025.12.0",
    "ipykernel>=7.1.0",
    "polars>=1.37.1",
    "python-dotenv",
    "pip3-autoremove>=2.0.1",
    "datasets>=4.5.0",
]

[project.optional-dependencies]
vllm = ["vllm"]
sglang = ["sglang"]
cli = ["typer", "rich"]
export = ["pyarrow", "datasets"]

[project.scripts]
cleanslate = "cleanslate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
