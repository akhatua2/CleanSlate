[project]
name = "cleanslate"
version = "0.1.0"
description = "Calculate probability of model outputs given seed tokens"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "pandas>=3.0.0",
    "bs4>=0.0.2",
    "pyarrow>=23.0.0",
    "fastparquet>=2025.12.0",
    "ipykernel>=7.1.0",
    "polars>=1.37.1",
    "lyricsgenius>=3.7.5",
    "dotenv>=0.9.9",
    "gemma>=3.3.0",
    "pip3-autoremove>=2.0.1",
    "jax[cuda12]>=0.9.0",
    "jaxlib>=0.9.0",
    "datasets>=4.5.0",
    "autoawq>=0.2.9",
]

[project.optional-dependencies]
vllm = ["vllm"]
sglang = ["sglang"]
cli = ["typer", "rich"]
export = ["pyarrow", "datasets"]

[project.scripts]
cleanslate = "cleanslate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
