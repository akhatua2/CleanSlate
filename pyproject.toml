[project]
name = "cleanslate"
version = "0.2.0"
description = "Memorization evaluation and unlearning for LLMs"
requires-python = "==3.12.*"
dependencies = [
    "vllm==0.19.0",
    "torch==2.10.0",
    "transformers==4.57.6",
    "pyarrow==23.0.1",
    "pyyaml==6.0.3",
    "datasets==4.7.0",
    "typer==0.24.1",
    "rich==14.3.3",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
eval = ["lm-eval==0.4.11", "litellm"]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
cleanslate = "cleanslate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
