[project]
name = "cleanslate"
version = "0.2.0"
description = "Memorization evaluation and unlearning for LLMs"
requires-python = "==3.12.*"
dependencies = [
    "vllm==0.19.1",
    "torch==2.10.0",
    "transformers==5.6.0",
    "pyarrow==23.0.1",
    "pyyaml==6.0.3",
    "datasets==4.7.0",
    "typer==0.24.1",
    "rich==14.3.3",
    "tqdm==4.67.3",
    "matplotlib>=3.10.8",
    "bitsandbytes>=0.49.2",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
eval = [
    "lm-eval[api]==0.4.11",
    "litellm==1.83.0",
    "python-dotenv==1.0.1",
    "ray>=2.9",
    "modal==1.4.2",
]
dev = ["ruff", "mypy", "pytest"]
curation = [
    "polars",
    "zstandard",
    "bm25s",
    "numpy",
]
unlearning = ["accelerate>=0.34"]
modal = ["modal>=1.4.2"]

[project.scripts]
cleanslate = "cleanslate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
