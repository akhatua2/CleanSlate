eval:
  window_prefix_len: 100
  window_suffix_len: 100
  window_stride: 10
  tau_min: 0.001
  batch_size: 16384

vllm:
  num_gpus: 2          # tensor_parallel_size — 70B bf16 ~140GB needs >=2× H100
  data_parallel: 1
  gpu_memory_utilization: 0.92
  max_model_len: 512
  dtype: bfloat16
  enforce_eager: false
